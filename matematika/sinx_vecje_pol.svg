<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" font-family="sans-serif" font-size="14">
  <rect width="320" height="300" fill="white"/>
  <!-- osi -->
  <line x1="30" y1="150" x2="290" y2="150" stroke="#888"/>
  <line x1="160" y1="280" x2="160" y2="20" stroke="#888"/>
  <text x="292" y="154">x</text>
  <text x="164" y="18">y</text>
  <!-- enotski krog -->
  <circle cx="160" cy="150" r="100" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- y = 1/2 -->
  <line x1="30" y1="100" x2="290" y2="100" stroke="#1f77b4" stroke-dasharray="5,4"/>
  <text x="166" y="95" fill="#1f77b4">y = 1/2</text>
  <!-- območje sin x > 1/2 -->
  <path d="M246.6,100 A100,100 0 0 0 73.4,100" fill="none" stroke="#d62728" stroke-width="5"/>
  <!-- poltraka -->
  <line x1="160" y1="150" x2="246.6" y2="100" stroke="#333"/>
  <line x1="160" y1="150" x2="73.4" y2="100" stroke="#333"/>
  <circle cx="246.6" cy="100" r="4" fill="#333"/>
  <circle cx="73.4" cy="100" r="4" fill="#333"/>
  <text x="252" y="96">π/6</text>
  <text x="22" y="96">5π/6</text>
  <text x="140" y="42" fill="#d62728">sin x &gt; 1/2</text>
</svg>
