<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Diagram primerov uporabe: Knjižnica</title>
  <defs>
    <marker id="odprta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#222" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#fff"/>

  <!-- meja sistema -->
  <rect x="130" y="30" width="540" height="425" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="400" y="57" text-anchor="middle" font-weight="bold">Sistem: Knjižnica</text>

  <!-- povezave akter - primer uporabe (polne črte) -->
  <g stroke="#222" stroke-width="1.4" fill="none">
    <line x1="80" y1="225" x2="218.7" y2="144.1"/>
    <line x1="80" y1="225" x2="169.6" y2="220.0"/>
    <line x1="80" y1="225" x2="335.3" y2="300.8"/>
    <line x1="720" y1="225" x2="464.7" y2="300.8"/>
    <line x1="720" y1="225" x2="581.3" y2="144.1"/>
  </g>

  <!-- include in extend (črtkane puščice z odprto konico) -->
  <g stroke="#222" stroke-width="1.4" fill="none">
    <line x1="352.0" y1="215.0" x2="448.0" y2="215.0" stroke-dasharray="7 5" marker-end="url(#odprta)"/>
    <line x1="400.0" y1="383.0" x2="400.0" y2="347.0" stroke-dasharray="7 5" marker-end="url(#odprta)"/>
  </g>
  <text x="400" y="207" text-anchor="middle" font-style="italic" font-size="13">«include»</text>
  <text x="388" y="369" text-anchor="end" font-style="italic" font-size="13">«extend»</text>

  <!-- opomba s pogojem pri extend -->
  <polygon points="510,348 635,348 650,363 650,392 510,392" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <polyline points="635,348 635,363 650,363" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="520" y="366" font-size="13">pogoj:</text>
  <text x="520" y="383" font-size="13">vrnitev po roku</text>
  <line x1="510" y1="366" x2="401" y2="366" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- primeri uporabe (elipse) -->
  <ellipse cx="260" cy="120" rx="92" ry="27" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="260" y="125" text-anchor="middle">Poišči knjigo</text>
  <ellipse cx="540" cy="120" rx="92" ry="27" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="540" y="125" text-anchor="middle">Dodaj knjigo</text>
  <ellipse cx="260" cy="215" rx="92" ry="27" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="260" y="220" text-anchor="middle">Izposodi knjigo</text>
  <ellipse cx="540" cy="215" rx="92" ry="27" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="540" y="220" text-anchor="middle">Preveri članstvo</text>
  <ellipse cx="400" cy="320" rx="92" ry="27" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="400" y="325" text-anchor="middle">Vrni knjigo</text>
  <ellipse cx="400" cy="410" rx="92" ry="27" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="400" y="415" text-anchor="middle">Obračunaj zamudnino</text>

  <!-- akterja -->
  <g stroke="#222" stroke-width="1.6" fill="none">
    <circle cx="60" cy="200" r="11" fill="#fff"/>
    <line x1="60" y1="211" x2="60" y2="245"/>
    <line x1="40" y1="225" x2="80" y2="225"/>
    <line x1="60" y1="245" x2="44" y2="272"/>
    <line x1="60" y1="245" x2="76" y2="272"/>
  </g>
  <text x="60" y="293" text-anchor="middle" font-weight="bold">Član</text>
  <g stroke="#222" stroke-width="1.6" fill="none">
    <circle cx="740" cy="200" r="11" fill="#fff"/>
    <line x1="740" y1="211" x2="740" y2="245"/>
    <line x1="720" y1="225" x2="760" y2="225"/>
    <line x1="740" y1="245" x2="724" y2="272"/>
    <line x1="740" y1="245" x2="756" y2="272"/>
  </g>
  <text x="740" y="293" text-anchor="middle" font-weight="bold">Knjižničar</text>
</svg>
